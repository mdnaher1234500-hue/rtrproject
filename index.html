<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>Class Attendance | College Attendance Management System</title>
  <meta name="description" content="Class Attendance is a college attendance management system for managing classes, roll numbers, daily attendance, sessions, and attendance records.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://rtrproject.vercel.app/">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Top Navigation / Header -->
    <div class="header-bar">
      <div class="header-left">
        <h1>Class Attendance</h1>
        <span id="connectionStatus" class="status-badge online" title="Connection Status">
          <span class="status-dot"></span>
          <span class="status-text">Online</span>
        </span>
      </div>
      <div class="header-actions">
        <button id="pwaInstallBtn" class="install-btn" style="display: none;" title="Install Class Attendance">
          ⬇️ Install
        </button>
        <button id="shareWebsiteBtn" class="share-btn" onclick="shareWebsite()" title="Share Website">
          <span class="share-icon">🔗</span> <span class="share-label">Share Website</span>
        </button>
        <button class="settings-btn" onclick="openSettingsModal()" title="Manage Classes & Roll Numbers">
          <span class="settings-icon">⚙️</span> <span class="settings-label">Settings</span>
        </button>
      </div>
    </div>

    <!-- Top Control Card (Class Selector, Date, Session) -->
    <div class="controls-card">
      <div class="top">
        <div class="input-wrap">
          <label for="classSelector" class="field-label">Class</label>
          <select id="classSelector" class="class-dropdown" onchange="handleClassChange(this.value)">
            <!-- Populated dynamically -->
          </select>
        </div>
        <div class="input-wrap">
          <label for="date" class="field-label">Date</label>
          <input type="date" id="date">
        </div>
      </div>

      <!-- Session Selection -->
      <div class="session-control">
        <label class="radio-label">
          <input type="radio" name="session" value="FORENOON" checked>
          <span>Forenoon</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="session" value="AFTERNOON">
          <span>Afternoon</span>
        </label>
      </div>
    </div>

    <!-- Roll buttons container -->
    <div class="roll-section">
      <div id="rollContainer" class="roll-grid"></div>
    </div>

    <!-- Summary & Register Grid on Laptop, Stacked on Mobile -->
    <div class="attendance-dashboard">
      <!-- Summary -->
      <div class="summary-section">
        <h3 class="section-title">Attendance Summary</h3>
        <div class="summary-cards">
          <div class="stat-card stat-present">
            <span class="stat-label">Present</span>
            <span class="stat-value" id="present">0</span>
          </div>
          <div class="stat-card stat-absent">
            <span class="stat-label">Absent</span>
            <span class="stat-value" id="absentCount">0</span>
          </div>
          <div class="stat-card stat-total">
            <span class="stat-label">Total</span>
            <span class="stat-value" id="total">0</span>
          </div>
        </div>
      </div>

      <!-- Output -->
      <div class="register-section">
        <h3 class="section-title">Attendance Register</h3>
        <textarea id="output" readonly></textarea>
        <button class="copy-btn" onclick="copyText()">📋 Copy Attendance</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal (Class Management & Roll Number Management) -->
  <div id="settingsModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-tabs">
          <button id="tabBtnRolls" class="tab-btn active" onclick="switchSettingsTab('rolls')">Roll Numbers</button>
          <button id="tabBtnClasses" class="tab-btn" onclick="switchSettingsTab('classes')">Class Management</button>
        </div>
        <button class="close-btn" onclick="closeSettingsModal()">&times;</button>
      </div>
      
      <!-- Tab 1: Roll Number Management -->
      <div id="tabContentRolls" class="tab-pane active">
        <div class="modal-toolbar">
          <div class="toolbar-left">
            <label for="modalClassSelect" class="toolbar-label">Class:</label>
            <select id="modalClassSelect" class="modal-dropdown" onchange="handleModalClassChange(this.value)">
              <!-- Populated dynamically -->
            </select>
            <button class="btn-primary" onclick="openAddRollModal()">+ Add Roll Number</button>
          </div>
          <div class="search-box">
            <input type="text" id="rollSearchInput" placeholder="Search Roll Number..." oninput="handleRollSearch(this.value)">
          </div>
        </div>

        <div class="roll-list-container">
          <table class="roll-table">
            <thead>
              <tr>
                <th style="width: 50px;">#</th>
                <th>Roll Number</th>
                <th style="width: 100px;">Reorder</th>
                <th style="width: 140px;">Actions</th>
              </tr>
            </thead>
            <tbody id="rollTableBody">
              <!-- Dynamic Roll rows -->
            </tbody>
          </table>
        </div>

        <div class="modal-footer">
          <div class="footer-left-actions">
            <button class="btn-danger-outline" onclick="handleDeleteAllRolls()" title="Delete All Roll Numbers from this class">Delete All Roll Numbers</button>
            <button class="btn-warning-outline" onclick="handleResetRolls()" title="Reset to Default Roll Numbers">Reset to Default</button>
          </div>
          <button class="btn-secondary" onclick="closeSettingsModal()">Close</button>
        </div>
      </div>

      <!-- Tab 2: Class Management -->
      <div id="tabContentClasses" class="tab-pane" style="display: none;">
        <div class="modal-toolbar">
          <button class="btn-primary" onclick="openAddClassModal()">+ Add Class</button>
        </div>

        <div class="roll-list-container">
          <table class="roll-table">
            <thead>
              <tr>
                <th style="width: 50px;">#</th>
                <th>Class Name</th>
                <th style="width: 120px;">Total Students</th>
                <th style="width: 140px;">Actions</th>
              </tr>
            </thead>
            <tbody id="classTableBody">
              <!-- Dynamic Class rows -->
            </tbody>
          </table>
        </div>

        <div class="modal-footer">
          <div></div>
          <button class="btn-secondary" onclick="closeSettingsModal()">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add / Edit Roll Number Modal -->
  <div id="rollEditModal" class="modal-overlay" style="display: none;">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h3 id="rollEditModalTitle">Add Roll Number</h3>
        <button class="close-btn" onclick="closeRollEditModal()">&times;</button>
      </div>
      <div class="modal-body">
        <label for="rollInput">Roll Number:</label>
        <input type="text" id="rollInput" placeholder="e.g. L19" maxlength="20" autofocus>
        <p id="rollInputError" class="error-msg" style="display: none;"></p>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeRollEditModal()">Cancel</button>
        <button class="btn-primary" id="saveRollBtn" onclick="saveRollNumber()">Save</button>
      </div>
    </div>
  </div>

  <!-- Add / Edit Class Modal -->
  <div id="classEditModal" class="modal-overlay" style="display: none;">
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h3 id="classEditModalTitle">Add Class</h3>
        <button class="close-btn" onclick="closeClassEditModal()">&times;</button>
      </div>
      <div class="modal-body">
        <label for="classInput">Class Name:</label>
        <input type="text" id="classInput" placeholder="e.g. CSM-A" maxlength="30" autofocus>
        <p id="classInputError" class="error-msg" style="display: none;"></p>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeClassEditModal()">Cancel</button>
        <button class="btn-primary" id="saveClassBtn" onclick="saveClass()">Save</button>
      </div>
    </div>
  </div>

  <script src="scrip.js"></script>
</body>
</html>
